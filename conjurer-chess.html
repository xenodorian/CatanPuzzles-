      }
      if (ms.length > 1) { showChoice(s, ms); return; }
      deselect(); doMove(ms[0]); return;
    }
    var p = st.board[s];
    deselect();
    if (p !== 0) {
      showInfo(p, s);
      if ((p > 0) === (st.turn > 0)) {
        sel = s;
        for (var i = 0; i < legal.length; i++) {
          var o = DC.toObj(legal[i]);
          if (o.summon || o.illusionAct || o.reveal) continue;
          if (o.from !== s) continue;
          (targets[o.to] = targets[o.to] || []).push(legal[i]);
        }
        SFX.play('select');
      }
    }
    refreshMarks();
  }

  function animate(m) {
    var o = DC.toObj(m);
    if (o.summon || o.illusionAct) {
      if (cells[o.to] && st.board[o.to]) cells[o.to].appendChild(pieceEl(st.board[o.to], o.to));
      return;
    }
    if (o.reveal) return;
    if (o.capture && st.board[o.from] !== 0) {
      // illusion hit: vanish victim, stay
      var vic = pieceIn(o.ep ? o.to + (st.turn < 0 ? -8 : 8) : o.to); // turn already flipped
      // After make, turn has flipped, so side that moved is -st.turn. EP cap sq: for white (mover now -turn if turn is black): dest-8
      var capSq = o.ep ? (o.to + ((-st.turn) > 0 ? -8 : 8)) : o.to;
      vic = pieceIn(capSq);
      if (vic) { vic.classList.add('dying'); setTimeout(function () { vic.remove(); }, 300); }
      return;
    }
    if (o.castle) { buildBoards(); return; }
    var from = o.from, to = o.to, victim = pieceIn(to);
    if (o.ep) {
      var epSq = to + ((-st.turn) > 0 ? -8 : 8);
      var ev = pieceIn(epSq);
      if (ev) { ev.classList.add('dying'); setTimeout(function () { ev.remove(); }, 300); }
    }
    var el = pieceIn(from);
    if (!el) { buildBoards(); return; }
    if (victim) { victim.classList.add('dying'); setTimeout(function () { victim.remove(); }, 300); }
    var a = el.getBoundingClientRect();
    cells[to].appendChild(el);
    var b = el.getBoundingClientRect();
    el.style.transition = 'none';
    el.style.transform = 'translate(' + (a.left - b.left) + 'px,' + (a.top - b.top) + 'px)';
    el.classList.add('moving');
    void el.offsetWidth;
    el.style.transition = '';
    el.style.transform = '';
    setTimeout(function () {
      el.classList.remove('moving');
      if (o.promo && st.board[to]) {
        var typ = Math.abs(st.board[to]);
        var g = el.querySelector('.glyph');
        if (g) g.textContent = GLYPH[typ][st.board[to] > 0 ? 'w' : 'b'];
      }
    }, 320);
  }

  function doMove(m) {
    deselect(); clearMode();
    var o = DC.toObj(m);
    push(m);
    animate(m);
    if (cfg.sound) {
      if (stat.over) SFX.play(stat.winner === 0 ? 'draw' : (cfg.mode !== 'ai' || stat.winner === cfg.side ? 'win' : 'lose'));
      else if (stat.check) SFX.play('check');
      else if (o.reveal) SFX.play('select');
      else if (o.summon || o.illusionAct) SFX.play('promote');
      else if (o.promo) SFX.play('promote');
      else if (o.capture || o.ep) SFX.play('capture');
      else SFX.play('move');
    }
    refreshMarks(); refreshPanel(); store();
    if (stat.over) setTimeout(showOver, 700);
    else if (!humanTurn()) askAI();
  }

  function maybeReveal(m) {
    if (m == null) return m;
    var o = DC.toObj(m);
    if (!o.capture || o.reveal || o.summon || o.illusionAct) return m;
    var to = o.ep ? (o.to + (st.turn > 0 ? -8 : 8)) : o.to;
    if (!st.board[to] || st.revealed[to]) return m;
    var rev = null, i, x;
    for (i = 0; i < legal.length; i++) {
      x = DC.toObj(legal[i]);
      if (x.reveal && x.to === to) { rev = legal[i]; break; }
    }
    if (rev == null) return m;
    var lvl = Math.max(0, botLevel(st.turn));
    var chance = [0.12, 0.22, 0.35, 0.5, 0.65][lvl] || 0.25;
    return Math.random() < chance ? rev : m;
  }

  function makeWorker() {
    try {
      var src = $('engine-src').textContent +
        '\nonmessage=function(e){var d=e.data;postMessage({id:d.id,r:DC.think(DC.load(d.state),d.opt)});};';
      var w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      w.onmessage = function (e) { aiDone(e.data.id, e.data.r); };
      w.onerror = function () { useWorker = false; worker = null; if (busy) thinkSync(reqId); };
      return w;
    } catch (e) { useWorker = false; return null; }
  }
  function aiOpt() { var L = LEVELS[Math.max(0, botLevel(st.turn))]; return { depth: L.depth, time: L.time || 0, noise: L.noise || 0 }; }
  function thinkSync(id) {
    setTimeout(function () {
      if (id !== reqId) return;
      aiDone(id, DC.think(DC.load(DC.save(st)), aiOpt()));
    }, 60);
  }
  function askAI() {
    busy = true; reqAt = Date.now(); var id = ++reqId;
    refreshPanel(); refreshMarks();
    if (useWorker && !worker) worker = makeWorker();
    if (worker) worker.postMessage({ id: id, state: DC.save(st), opt: aiOpt() });
    else thinkSync(id);
  }
  function aiDone(id, r) {
    if (id !== reqId || !busy) return;
    var wait = Math.max(0, 450 - (Date.now() - reqAt));
    setTimeout(function () {
      if (id !== reqId || !busy) return;
      busy = false;
      var m = r && r.move;
      if (legal.indexOf(m) < 0) m = legal[0];
      m = maybeReveal(m);
      if (m !== undefined) doMove(m);
    }, wait);
  }
  function cancelAI() {
    reqId++;
    if (busy && worker) { worker.terminate(); worker = null; }
    busy = false;
  }

  function overTitle() {
    if (stat.winner === 0) return 'Draw: ' + sideName(1) + ' vs ' + sideName(-1);
    return sideName(stat.winner, true) + ' defeated ' + sideName(-stat.winner);
  }
  function showOver() {
    if (!stat.over) return;
    var why = {
      checkmate: 'Checkmate. ' + (stat.winner > 0 ? 'White' : 'Black') + ' has won the game.',
      stalemate: 'Stalemate. The side to move has no legal move.',
      repetition: 'The same position occurred three times.',
      moves: '50 moves each passed with no capture or pawn move.',
      material: 'Only the two Kings remain, and nothing is left in reserve.'
    };
    $('overTitle').textContent = overTitle(); $('overText').textContent = why[stat.result] || '';
    $('dlgOver').hidden = false;
  }
  var pend = { mode: 'ai', side: 1, level: 1 };
  function markOpts() {
    var set = function (id, v) {
      var bs = $(id).children;
      for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-v') === String(v));
    };
    set('optMode', pend.mode); set('optSide', pend.side); set('optLevel', pend.level);
    $('aiOpts').style.display = pend.mode === 'ai' ? '' : 'none';
    var sim = pend.level === 'sim';
    $('sideOpts').style.display = sim ? 'none' : '';
    $('levelNote').textContent = sim ? 'Watch two bots fight.' : LEVELS[pend.level].note;
  }
  function openNew() {
    if (window.VaultOnce && window.VaultOnce.active()) return;
    pend = { mode: cfg.mode === '2p' ? '2p' : 'ai', side: cfg.side, level: cfg.mode === 'sim' ? 'sim' : cfg.level };
    markOpts(); $('dlgOver').hidden = true; $('dlgNew').hidden = false;
  }
  function startNew() {
    cancelAI();
    if (pend.mode === 'ai' && pend.level === 'sim') {
      cfg.mode = 'sim';
      cfg.simG = (Math.random() * LEVELS.length) | 0; cfg.simS = (Math.random() * LEVELS.length) | 0;
    } else {
      cfg.mode = pend.mode; if (pend.level !== 'sim') cfg.level = pend.level;
      cfg.side = pend.side === 0 ? (Math.random() < 0.5 ? 1 : -1) : pend.side;
    }
    flipped = cfg.mode === 'ai' && cfg.side < 0;
    replay([]); deselect(); clearMode();
    $('dlgNew').hidden = true;
    $('info').textContent = 'Tap a piece to see where it can go, or use Summon, Illusion or Reveal.';
    buildBoards(); refreshMarks(); refreshPanel(); store();
    if (!humanTurn()) askAI();
  }
  function undo() {
    if (window.VaultOnce && window.VaultOnce.active()) return;
    if (!moves.length || cfg.mode === 'sim') return;
    cancelAI();
    var list = moves.slice(0, -1);
    if (cfg.mode === 'ai' && list.length % 2 !== (cfg.side > 0 ? 0 : 1) && list.length) list.pop();
    replay(list); deselect(); clearMode();
    $('dlgOver').hidden = true;
    buildBoards(); refreshMarks(); refreshPanel(); store();
    if (!stat.over && !humanTurn()) askAI();
  }
  function buildGuide() {
    var h = '<ul>' +
      '<li>This is standard 8×8 chess (including castling, en passant, promotion, check, checkmate and stalemate) with a conjuring twist.</li>' +
      '<li>Each side begins with only a King, on e1 (White) and e8 (Black). All other pieces start in a reserve: 8 pawns, 2 rooks, 2 knights, 2 bishops and a queen.</li>' +
      '<li>A turn is one of: move a piece; press <b>Summon</b> and place a remaining reserve piece on one of that type\'s empty default starting squares; press <b>Illusion</b> and weave an illusion of a reserve type (not the King) onto an empty default home; or press <b>Reveal</b> and choose one unrevealed enemy piece. Reveal is grouped with Illusion as the other illusion-side action.</li>' +
      '<li>Summon and illusion targets must be empty. Each side may have at most three illusions on the board. An illusion may be woven even if every real copy of that type has already been summoned. Illusions do not use up the reserve.</li>' +
      '<li>You see your own illusions tinted blue. To the opponent they look like ordinary pieces until they are revealed or they vanish.</li>' +
      '<li>Illusions move like the piece they mimic, but they cannot capture; they may only move to empty squares.</li>' +
      '<li>When any piece tries to capture an illusion, the illusion vanishes, the attacker stays on its square, and the attacker is paralyzed permanently. There is no Illusionist piece whose capture could lift the paralysis. Paralyzed pieces cannot move, capture or act, but they can still be captured. A gold-hatched marker is shown to both players. You may still Summon, weave an Illusion or Reveal even if your king is paralyzed.</li>' +
      '<li>The King may try to capture a possible illusion. A paralyzed King that is in check with no way out is checkmate. A paralyzed King that is not in check, when the side has no legal moves (including summons), is stalemate.</li>' +
      '<li>Check, checkmate and stalemate consider only real pieces. An illusion cannot put a King in check, and a King may legally walk onto a square an illusion appears to attack.</li>' +
      '<li>Castling follows the usual rules, and is allowed only if the King and that rook are real, unmoved, and the path is empty and not under real attack. A pawn summoned onto the second (or seventh) rank may use its double step.</li>' +
      '<li>When Summon or Illusion is active, 50% transparent ghost pieces mark every legal target. Only you see those ghosts (in a two-player game, the side to move).</li>' +
      '<li>White moves first. Checkmate the enemy King to win.</li>' +
      '<li>Draws: stalemate, the same position three times, 50 moves each with no capture or pawn move, or only the two Kings left with nothing in reserve.</li></ul>' +
      '<p class="credits">Conjurer\'s Chess applies the conjuring rules of Conjurer\'s Wyvern Chess to standard chess. Standard chess rules follow FIDE practice (castling, en passant, promotion). This is an unofficial fan variant.</p>';
    $('guideBody').innerHTML = h;
  }

  function init() {
    var onceLink = false;
    try { onceLink = new URL(location.href).searchParams.has('once'); } catch (e) { onceLink = false; }
    var saved = onceLink ? null : restore();
    replay(saved || []);
    SFX.setMuted(!cfg.sound);
    LEVELS.forEach(function (L, i) {
      var b = document.createElement('button'); b.type = 'button'; b.setAttribute('data-v', i); b.textContent = L.name;
      $('optLevel').appendChild(b);
    });
    layout(); buildBoards(); buildGuide(); refreshMarks(); refreshPanel();
    $('boards').addEventListener('click', function (e) {
      var c = e.target.closest ? e.target.closest('.cell') : null;
      if (c) onCell(+c.getAttribute('data-sq'));
    });
    ['optMode', 'optSide', 'optLevel'].forEach(function (id) {
      $(id).addEventListener('click', function (e) {
        var v = e.target.getAttribute && e.target.getAttribute('data-v');
        if (v === null || v === undefined) return;
        if (id === 'optMode') pend.mode = v; else if (id === 'optSide') pend.side = +v; else pend.level = v === 'sim' ? 'sim' : +v;
        markOpts();
      });
    });
    $('bNew').onclick = openNew;
    $('newCancel').onclick = function () { $('dlgNew').hidden = true; };
    $('newStart').onclick = startNew;
    $('bUndo').onclick = undo;
    $('bFlip').onclick = function () { flipped = !flipped; buildBoards(); refreshMarks(); store(); };
    $('bSound').onclick = function () { cfg.sound = !cfg.sound; SFX.setMuted(!cfg.sound); refreshPanel(); store(); if (cfg.sound) SFX.play('move'); };
    $('bGuide').onclick = function () { $('dlgGuide').hidden = false; };
    $('guideClose').onclick = function () { $('dlgGuide').hidden = true; };
    $('overClose').onclick = function () { $('dlgOver').hidden = true; };
    $('overNew').onclick = openNew;
    $('bSummon').onclick = function () { setMode('summon'); };
    $('bIllusion').onclick = function () { setMode('illusion'); };
    $('bReveal').onclick = function () { setMode('reveal'); };
    var mods = document.querySelectorAll('.modal');
    for (var i = 0; i < mods.length; i++) mods[i].addEventListener('click', function (e) { if (e.target === this && this.id !== 'dlgNew') this.hidden = true; });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        hideChoice(); clearMode(); deselect(); refreshMarks();
        $('dlgGuide').hidden = true; $('dlgOver').hidden = true;
        if (moves.length) $('dlgNew').hidden = true;
      }
    });
    window.addEventListener('resize', layout);
    window.addEventListener('orientationchange', function () { setTimeout(layout, 200); });
    if (onceLink) { /* VaultOnce.startOnce boots the pinned AI game. */ }
    else if (!saved) openNew();
    else if (stat.over) showOver();
    else if (!humanTurn()) askAI();
  }

  function typOf(t) {
    if (typeof t === 'string') {
      var u = t.toUpperCase();
      if (u === 'P' || u === 'PAWN') return DC.P;
      if (u === 'N' || u === 'KNIGHT') return DC.N;
      if (u === 'B' || u === 'BISHOP') return DC.B;
      if (u === 'R' || u === 'ROOK') return DC.R;
      if (u === 'Q' || u === 'QUEEN') return DC.Q;
      return DC.LETTERS.indexOf(u);
    }
    return t;
  }
  function applyLegal(pred) {
    var i, m;
    for (i = 0; i < legal.length; i++) {
      if (pred(DC.toObj(legal[i]), legal[i])) {
        m = legal[i];
        deselect(); clearMode();
        doMove(m);
        return m;
      }
    }
    return null;
  }

  window.DragonChessUI = {
    startOnce: function (opts) {
      opts = opts || {};
      var level = opts.level;
      if (!(level >= 0 && level < LEVELS.length)) level = 1;
      var side = opts.side;
      if (side === -1 || side === 'scarlet' || side === 'black') side = -1;
      else side = 1;
      pend = { mode: 'ai', side: side, level: level };
      startNew();
    },
    result: function () {
      if (!stat || !stat.over) return { over: false };
      var draw = stat.winner === 0;
      var success = !draw && stat.winner === cfg.side;
      var summary;
      if (draw) summary = 'The game was a draw (' + (stat.result || 'draw') + ').';
      else if (success) summary = 'You won' + (stat.result ? ' by ' + stat.result : '') + '.';
      else summary = 'You lost' + (stat.result ? ' by ' + stat.result : '') + '.';
      return { over: true, success: success, draw: draw, summary: summary, result: stat.result, winner: stat.winner };
    },
    isOver: function () { return !!(stat && stat.over); }
  };
  window.ConjurerStd = {
    getState: function () { return DC.save(st); },
    legalMoves: function () { return legal.slice(); },
    status: function () { return stat; },
    inCheck: function () { return DC.inCheck(st); },
    move: function (m) { if (legal.indexOf(m) < 0) return false; deselect(); clearMode(); doMove(m); return true; },
    summon: function (typ, s) { typ = typOf(typ); return applyLegal(function (o) { return o.summon && o.typ === typ && (s == null || o.to === s); }); },
    illusion: function (typ, s) { typ = typOf(typ); return applyLegal(function (o) { return o.illusionAct && o.typ === typ && (s == null || o.to === s); }); },
    reveal: function (s) { return applyLegal(function (o) { return o.reveal && o.to === s; }); },
    setMode: setMode,
    mode: function () { return mode; },
    isIllusion: function (s) { return !!(st.illusion && st.illusion[s]); },
    isParalyzed: function (s) { return !!(st.paralyzed && st.paralyzed[s]); },
    isRevealed: function (s) { return st.revealed ? st.revealed[s] : 0; },
    reserve: function (side) { return Array.prototype.slice.call(DC.resOf(st, side)); },
    viewAs: function () { return viewSide(); },
    startTwoPlayer: function () { pend = { mode: '2p', side: 1, level: 1 }; startNew(); },
    startAI: function (opts) {
      opts = opts || {};
      var side = opts.side === -1 || opts.side === 'black' || opts.side === 'scarlet' ? -1 : 1;
      pend = { mode: 'ai', side: side, level: (opts.level >= 0 ? opts.level : 0) };
      startNew();
    },
    applyState: function (o) {
      cancelAI();
      st = DC.load(o);
      legal = DC.legalMoves(st); stat = DC.status(st, legal);
      moves = []; texts = []; caps = [];
      deselect(); clearMode();
      $('dlgNew').hidden = true;
      $('dlgOver').hidden = !stat.over;
      buildBoards(); refreshMarks(); refreshPanel();
      if (stat.over) showOver();
    },
    selectSquare: function (s) { onCell(s); },
    deselect: function () { deselect(); clearMode(); refreshMarks(); },
    ghostSquares: function () {
      var out = [], i, el;
      for (i = 0; i < 64; i++) {
        if (!cells[i]) continue;
        el = cells[i].querySelector('.piece.ghost');
        if (!el) continue;
        out.push({ sq: i, name: DC.sqName(i), className: el.className, opacity: getComputedStyle(el).opacity });
      }
      return out;
    },
    engine: function () { return DC; }
  };
  init();
})();

</script>
</body>
</html>
